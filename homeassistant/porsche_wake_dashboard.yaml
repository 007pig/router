        {
          "type": "markdown",
          "content": "异常和晨间摘要推送到已选 iPhone；普通成功、正常跳过不逐条通知。08:00 是本地核对基准，不修改车辆定时器。手机接口接受不代表实际送达。\n\n晚间检查有独立开关。仅确认未插枪时发送 WhatsApp 中文消息和 iPhone Time Sensitive 提醒；确认已插枪且为 Direct 时，每天最多尝试关闭一次。成功、失败或结果未知均只记录，不发送晚间提醒；普通状态不明只记录。关闭 Direct 可能停止直接充电，不等于保证定时器生效。状态查询仍为夜间最多 4 次＋晚间最多 1 次，关闭命令另计。"
