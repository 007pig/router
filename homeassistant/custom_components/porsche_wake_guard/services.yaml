run:
  name: Check scheduled wake request
  description: Evaluate the current local time and apply persistent request limits.
  fields:
    manual:
      name: Manual test
      description: Ignore scheduled times only; all safety limits and the master switch still apply.
      selector:
        boolean:
resume:
  name: Resume after checking authentication
  description: Clear the authentication hold after reauthentication. Does not clear rate limits, pending requests or request history.
inspect:
  name: Inspect cached wake evidence
  description: Record sanitized cached charging data and measurement field names without sending any request to Porsche.
request_once_at:
  name: One-off scheduled request exception
  description: For one local date/time within 24 hours, use a 60-minute floor and ignore optional charging skips. Keeps daily cap, deduplication, authentication and rate-limit holds. The time must also be enabled in the schedule.
  fields:
    slot:
      required: true
      example: "2026-10-12|07:00"
      selector:
        text:
refresh_report:
  name: 刷新本地效果面板
  description: 只读取已有日志和缓存，不发送车辆请求。
notification_test:
  name: 测试 iPhone 通知
  description: 发送明确标注的测试通知，不唤醒车辆。
confirm_night:
  name: 确认充电夜现场条件
  description: 用于有效样本统计，不修改车辆设置。
  fields:
    date:
      required: true
      example: "2026-10-13"
      selector:
        text:
    plugged:
      required: true
      selector:
        boolean:
    no_intervention:
      required: true
      selector:
        boolean:
